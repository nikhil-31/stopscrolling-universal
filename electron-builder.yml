appId: com.stopscrolling.desktop
productName: Stop Scrolling
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    CFBundleName: Stop Scrolling
    CFBundleDisplayName: Stop Scrolling
    NSAppleEventsUsageDescription: Stop Scrolling reads the frontmost app and browser tab so it can record screen time.
win:
  target:
    - nsis
linux:
  category: Utility
  target:
    - AppImage
    - deb
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
