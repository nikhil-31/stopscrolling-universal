appId: com.stopscrolling.desktop
productName: Stop Scrolling
protocols:
  - name: Stop Scrolling
    schemes:
      - stopscrolling
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
extraResources:
  - from: resources
    to: .
  - from: release-native
    to: native
afterPack: scripts/sign-mac-widget.mjs
afterSign: scripts/sign-mac-widget.mjs
mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extraFiles:
    - from: native/macos/.derivedData/widget-pack/StopScrollingWidget.appex
      to: PlugIns/StopScrollingWidget.appex
    - from: native/macos/.derivedData/widget-pack/StopScrollingWidgetReload.dylib
      to: Frameworks/StopScrollingWidgetReload.dylib
    - from: native/macos/.derivedData/widget-pack/StopScrollingCalendar.dylib
      to: Frameworks/StopScrollingCalendar.dylib
  extendInfo:
    CFBundleName: Stop Scrolling
    CFBundleDisplayName: Stop Scrolling
    NSAppleEventsUsageDescription: Stop Scrolling reads the frontmost app and browser tab so it can record screen time.
    NSCalendarsUsageDescription: Stop Scrolling shows your calendar events next to your screen time. It never changes your calendars.
    NSCalendarsFullAccessUsageDescription: Stop Scrolling shows your calendar events next to your screen time. It never changes your calendars.
win:
  target:
    - nsis
linux:
  category: Utility
  target:
    - AppImage
    - deb
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
