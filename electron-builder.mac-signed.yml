appId: com.stopscrolling.desktop
productName: Stop Scrolling
protocols:
  - name: Stop Scrolling
    schemes:
      - stopscrolling
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
extraResources:
  - from: resources
    to: .
  - from: release-native
    to: native
afterPack: scripts/sign-mac-widget.mjs
afterSign: scripts/sign-mac-widget.mjs
extraFiles:
  - from: release-native/macos/SystemExtensions
    to: Library/SystemExtensions
  - from: native/macos/.derivedData/widget-pack/StopScrollingWidget.appex
    to: PlugIns/StopScrollingWidget.appex
  - from: native/macos/.derivedData/widget-pack/StopScrollingWidgetReload.dylib
    to: Frameworks/StopScrollingWidgetReload.dylib
  - from: release-native/macos/LaunchDaemons
    to: Library/LaunchDaemons
  - from: release-native/macos/PrivilegedHelperTools
    to: Library/PrivilegedHelperTools
mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  hardenedRuntime: true
  provisioningProfile: release-native/macos/embedded.provisionprofile
  entitlements: release-native/macos/StopScrolling.entitlements
  entitlementsInherit: build/entitlements.mac.plist
  signIgnore:
    - Library/PrivilegedHelperTools/com.stopscrolling.helper
    - Library/SystemExtensions/.*
    - Resources/native/macos/libStopScrollingHostClient.dylib
  extendInfo:
    CFBundleName: Stop Scrolling
    CFBundleDisplayName: Stop Scrolling
    NSAppleEventsUsageDescription: Stop Scrolling reads the frontmost app and browser tab so it can record screen time.
win:
  target:
    - nsis
linux:
  category: Utility
  target:
    - AppImage
    - deb
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
